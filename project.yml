name: BackflowLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  BackflowLog:
    type: application
    platform: iOS
    sources:
      - path: BackflowLog
      - path: Shared
    dependencies:
      - target: BackflowLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.backflow-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: BackflowLog/BackflowLog.entitlements
    info:
      path: BackflowLog/Info.plist
      properties:
        CFBundleDisplayName: Backflow Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  BackflowLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BackflowLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.backflow-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: BackflowLogWidget/BackflowLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: BackflowLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Backflow Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BackflowLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BackflowLogTests
    dependencies:
      - target: BackflowLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.backflow-log.tests
        GENERATE_INFOPLIST_FILE: YES
  BackflowLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BackflowLogUITests
    dependencies:
      - target: BackflowLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.backflow-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BackflowLog
schemes:
  BackflowLog:
    build:
      targets:
        BackflowLog: all
        BackflowLogTests: [test]
        BackflowLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: BackflowLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: BackflowLog/StoreKit/Products.storekit
      targets:
        - BackflowLogTests
        - BackflowLogUITests
    archive:
      config: Release
